name: xwayland-satellite
type: shell
sources:
  - type: git
    url: https://github.com/Supreeeme/xwayland-satellite.git
    tag: v0.8.3
commands:
  - cd /sources/xwayland-satellite/xwayland-satellite
  - cargo build --release
  - cargo install cargo-deb
  - cargo deb
  - apt install -y ./target/debian/xwayland-satellite_*.deb

